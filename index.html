<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8-bit Coin Flip</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 192, H = 144;              // низкое "8-битное" разрешение
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

function resize(){
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', resize); resize();

// Пиксельные символы 5x7
const GLYPHS = {
  BTC: [" # # ","#### "," #  #"," ### "," #  #","#### "," # # "],
  ETH: ["#####","     ","     "," ### ","     ","     ","#####"],
  USD: ["  #  "," ####","# #  "," ### ","  # #","#### ","  #  "],
  EUR: ["  ###"," #   ","#### "," #   ","#### "," #   ","  ###"],
  RUB: ["#### ","#   #","#### ","#    ","###  ","#    ","#    "]
};

const R = 9; // радиус монеты в пикселях
// Готовим лицевую сторону каждой монеты как битмап (1 = белый, 0 = чёрный, -1 = прозрачно)
function makeFace(glyph){
  const n = R * 2 + 1, face = [];
  for (let y = 0; y < n; y++){
    const row = [];
    for (let x = 0; x < n; x++){
      const dx = x - R, dy = y - R, d = Math.sqrt(dx*dx + dy*dy);
      if (d > R + 0.3) row.push(-1);
      else if (d > R - 1.7 && d <= R - 0.7) row.push(0);   // внутренний обод
      else row.push(1);
    }
    face.push(row);
  }
  const g = GLYPHS[glyph], gx = R - 2, gy = R - 3;
  for (let y = 0; y < 7; y++)
    for (let x = 0; x < 5; x++)
      if (g[y][x] === '#') face[gy + y][gx + x] = 0;
  return face;
}
const FACES = {}; for (const k in GLYPHS) FACES[k] = makeFace(k);

// Рисуем монету с эффектом вращения (сжатие по горизонтали) и масштабом k
function px(x, y, k){ ctx.fillRect(Math.round(x), Math.round(y), Math.ceil(k), Math.ceil(k)); }
function drawCoin(cx, cy, angle, glyph, k){
  k = k || 1;
  const face = FACES[glyph], n = R * 2 + 1;
  const sx = Math.cos(angle), w = Math.abs(sx);
  cx = Math.round(cx); cy = Math.round(cy);
  if (w < 0.12){ // ребро монеты
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - Math.round(k), Math.round(cy - R*k), Math.ceil(2*k), Math.ceil(n*k));
    return;
  }
  const half = Math.round(R * w);
  const back = sx < 0; // обратная сторона: без символа, с полосками
  for (let tx = -half; tx <= half; tx++){
    const srcX = Math.round(tx / w) + R;
    if (srcX < 0 || srcX >= n) continue;
    for (let y = 0; y < n; y++){
      let v = face[y][back ? n - 1 - srcX : srcX];
      if (v === -1) continue;
      if (back && v === 0){
        const dx = srcX - R, dy = y - R;
        if (Math.sqrt(dx*dx + dy*dy) < R - 2) v = 1;
      }
      if (back && v === 1 && (y % 4 === 0) && Math.abs(y - R) < R - 3 && Math.abs(srcX - R) < R - 3) v = 0;
      ctx.fillStyle = v ? '#fff' : '#000';
      px(cx + tx*k, cy + (y - R)*k, k);
    }
  }
}

// Состояние сцены
const GROUND = H - 20, G = 0.18;
const easeOut = t => 1 - Math.pow(1 - t, 3);
let coins, sparks, phase, frame;

function reset(){
  coins = [{ t:'BTC', x: W/2, y: GROUND - R, vy: -4.2, a: 0, spin: 0.35, k: 1, kt: 1, main: true }];
  sparks = []; phase = 'up'; frame = 0;
}
reset();

function burst(m){
  const offs = [['ETH',-62,-4],['USD',-30,-34],['EUR',30,-34],['RUB',62,-4]];
  offs.forEach(([t, dx, dy], i) => coins.push({
    t, sx: m.x, sy: m.y, tx: m.x + dx, ty: m.y + dy, x: m.x, y: m.y,
    p: 0, a: Math.random()*6, spin: 0.4, k: 1, kt: 1, i: i + 1
  }));
  for (let i = 0; i < 24; i++){
    const ang = Math.PI * 2 * i / 24, sp = 1.5 + Math.random()*1.5;
    sparks.push({ x: m.x, y: m.y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, life: 18 + Math.random()*10 });
  }
}

// Плавно доворачиваем монету лицевой стороной к зрителю
function settle(c){
  const full = Math.PI * 2, rest = ((c.a % full) + full) % full;
  if (c.spin > 0.06){ c.spin *= 0.97; c.a += c.spin; }
  else c.a += (rest > Math.PI ? full - rest : -rest) * 0.12;
}

function step(){
  frame++;
  const m = coins[0];
  if (phase === 'up'){
    m.vy += G; m.y += m.vy; m.a += m.spin;
    if (m.vy >= 0){ phase = 'hover'; m.hy = m.y; m.i = 0; burst(m); }
  }
  for (const c of coins){
    if (!c.main){
      if (c.p < 1){
        c.p = Math.min(1, c.p + 1/45);
        const e = easeOut(c.p);
        c.x = c.sx + (c.tx - c.sx) * e;
        c.y = c.sy + (c.ty - c.sy) * e;
        c.a += c.spin;
      } else {
        settle(c);
        c.y = c.ty + Math.sin(frame * 0.05 + c.i) * 1.5;
      }
    } else if (phase === 'hover'){
      settle(c);
      c.y = c.hy + Math.sin(frame * 0.05) * 1.5;
    }
    c.k += (c.kt - c.k) * 0.2;
  }
  for (const s of sparks){ s.x += s.vx; s.y += s.vy; s.vx *= 0.94; s.vy *= 0.94; s.life--; }
  sparks = sparks.filter(s => s.life > 0);
}

function draw(){
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (let x = 0; x < W; x += 4) ctx.fillRect(x, GROUND, 2, 1);
  const m = coins[0];
  const h = Math.max(0, (GROUND - R) - m.y);
  const sw = Math.max(2, Math.round(R - h / 8));
  for (let x = -sw; x <= sw; x += 2) ctx.fillRect(Math.round(m.x) + x, GROUND + 2, 1, 1);
  for (const s of sparks) ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);
  // увеличенные монеты рисуем поверх остальных
  [...coins].sort((a, b) => a.k - b.k).forEach(c => drawCoin(c.x, c.y, c.a, c.t, c.k));
}

let last = 0, acc = 0;
function loop(t){
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000/60){ step(); acc -= 1000/60; }
  draw();
  requestAnimationFrame(loop);
}

// Клик по монете: увеличить / вернуть обратно
function toLocal(e){
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
function hit(x, y){
  return [...coins].sort((a, b) => b.k - a.k)
    .find(c => Math.hypot(x - c.x, y - c.y) <= (R + 1) * c.k);
}
cv.addEventListener('click', e => {
  if (phase !== 'hover') return;
  const c = hit(...toLocal(e));
  if (c) c.kt = c.kt > 1 ? 1 : 3;
});
cv.addEventListener('mousemove', e => {
  cv.style.cursor = phase === 'hover' && hit(...toLocal(e)) ? 'pointer' : 'default';
});

const q = new URLSearchParams(location.search);
const pf = +q.get('frame');
if (pf){
  for (let i = 0; i < pf; i++){ if (i === 100 && q.get('zoom')) coins[+q.get('zoom')].kt = 3; step(); }
  draw();
} else requestAnimationFrame(t => { last = t; loop(t); });
</script>
</body>
</html>
